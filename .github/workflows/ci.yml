name: trace-doctor-ci

# This file does nothing inside the repository it is written in: GitHub reads
# workflows only from the root `.github/workflows/` of the repository it is
# building, so it takes effect once this package is a repository of its own,
# which is the published tree. It lives here, beside the package, so the CI a
# release tree runs is reviewed as part of that tree rather than assembled
# later from memory.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the commit and never cancelling. A per-ref group with
  # `cancel-in-progress: true` cancels the previous commit's run as soon as a
  # newer one is pushed to the same ref, and the run that was already going
  # then reports a failure on a commit nobody judged. Runner minutes are
  # cheaper than a red nobody can act on.
  group: trace-doctor-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: trace-doctor-ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: ["20", "22"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record the runtime under test
        id: runtime
        run: |
          node --version
          npm --version
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "npm=$(npm --version)" >> "$GITHUB_OUTPUT"

      - name: Install from the lockfile
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run the suite
        run: npm test

      - name: Build
        run: npm run build

      # No test spawns the built CLI: the suite imports src/ directly, so
      # `dist/` compiling and `bin/trace` finding the bundled schema beside it
      # were unproven by anything automated. These are the two things this step
      # is for.
      - name: Run the built CLI
        run: |
          set -euo pipefail
          ./bin/trace --help
          ./bin/trace validate examples/success.jsonl
          ./bin/trace validate examples/failed.jsonl
          ./bin/trace validate examples/cancelled.jsonl
          ./bin/trace summary examples/success.jsonl --json
          # `diff` exits 1 by contract when the two traces differ, so the number
          # is asserted rather than swallowed: a CLI that stopped reporting a
          # difference would be exactly as red as one that crashed.
          code=0
          ./bin/trace diff examples/success.jsonl examples/failed.jsonl >/dev/null || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::diff exited $code, expected 1 for two traces that differ" >&2
            exit 1
          fi

      # The suite pins what `files` declares; only an install proves the
      # declaration is sufficient, because a consumer gets no `src/` and no
      # `schemas/` outside the tarball.
      - name: Install the packed tarball into an empty directory
        run: |
          set -euo pipefail
          rm -f /tmp/agent-trace-doctor-*.tgz
          rm -rf /tmp/trace-doctor-clean
          mkdir /tmp/trace-doctor-clean
          npm pack --pack-destination /tmp
          cd /tmp/trace-doctor-clean
          npm init -y
          # No `bin` entry while the command name is undecided, so an installed
          # copy is run by path rather than by name.
          npm install /tmp/agent-trace-doctor-*.tgz
          node node_modules/agent-trace-doctor/bin/trace validate "$GITHUB_WORKSPACE/examples/success.jsonl"

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "### trace-doctor-ci (node ${{ steps.runtime.outputs.node }}, npm ${{ steps.runtime.outputs.npm }})"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- node: ${{ steps.runtime.outputs.node }}"
            echo "- npm: ${{ steps.runtime.outputs.npm }}"
            echo "- event: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
